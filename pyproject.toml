[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidataeco"
version = "3.0.0"
description = "Wann ist das Datennetz gut genug für KI? Ausführbares Modell zur wissenschaftlichen Arbeit"
authors = [
    { name = "Stephan Epp" }
]
requires-python = ">=3.11"
dependencies = [
    # Wiederverwendeter Entscheider-, Schaltkreis- und Wohlfahrtscode (Referenzprojekt).
    # numpy und matplotlib bringt das Referenzprojekt selbst mit; sie werden hier nicht doppelt gepflegt.
    "subgraph-sat-solver-econ @ git+https://github.com/naphets86/subgraph-sat-solver-econ.git",
    # JSON-API (web/api.py)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# YAML-Spezifikationen (JSON funktioniert ohne Zusatzpaket).
yaml = [
    "pyyaml",
]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "pyyaml",
    "httpx2",  # vom FastAPI-TestClient der API-Tests benötigt
]

[project.scripts]
aidataeco = "aidataeco.cli:main"
aidataeco-api = "web.api:run"

[tool.setuptools]
# Importname `aidataeco`: `src` ist als Paketname mehrdeutig (auch das Referenzprojekt nutzt ihn).
packages = ["aidataeco", "web"]
package-dir = { aidataeco = "src", web = "web" }

[tool.coverage.run]
source = ["src", "web"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "doc/*",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --cov=src --cov=web --cov-report=html:doc/coverage --cov-report=term-missing"
markers = [
    "unit: unit test",
    "integration: component integration test",
    "slow: computationally expensive test",
]
